<svg viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- bg gradient -->
  <rect width="375" height="812" fill="#0C0E1A"/>
  <ellipse cx="300" cy="180" rx="200" ry="180" fill="rgba(226,97,60,0.1)"/>
  <ellipse cx="80" cy="600" rx="160" ry="160" fill="rgba(75,61,245,0.12)"/>

  <!-- status bar -->
  <text x="24" y="24" font-family="system-ui" font-size="11" fill="rgba(244,240,230,0.4)">9:41</text>

  <!-- header -->
  <text x="24" y="68" font-family="system-ui" font-weight="800" font-size="22" fill="#F4F0E6">Just for fun 🎉</text>
  <text x="24" y="90" font-family="system-ui" font-size="12" fill="#8E90A6">Split bills, challenge friends, flex a bit.</text>

  <!-- Split bill card -->
  <rect x="16" y="108" width="343" height="140" rx="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="32" y="136" font-family="system-ui" font-weight="600" font-size="13" fill="#F4F0E6">Split a bill</text>
  <text x="32" y="154" font-family="system-ui" font-size="11" fill="#8E90A6">Oya, who owes what?</text>

  <!-- friend avatars -->
  <circle cx="48" cy="188" r="18" fill="#E2613C"/>
  <text x="48" y="193" font-family="system-ui" font-weight="700" font-size="12" fill="white" text-anchor="middle">T</text>
  <circle cx="80" cy="188" r="18" fill="#4B3DF5"/>
  <text x="80" y="193" font-family="system-ui" font-weight="700" font-size="12" fill="white" text-anchor="middle">A</text>
  <circle cx="112" cy="188" r="18" fill="#B9A8FF"/>
  <text x="112" y="193" font-family="system-ui" font-weight="700" font-size="12" fill="#0C0E1A" text-anchor="middle">K</text>
  <circle cx="144" cy="188" r="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="144" y="193" font-family="system-ui" font-size="16" fill="#8E90A6" text-anchor="middle">+</text>

  <text x="180" y="195" font-family="system-ui" font-size="11" fill="#8E90A6">₦45,000 ÷ 4 = </text>
  <text x="280" y="195" font-family="system-ui" font-weight="700" font-size="13" fill="#F4F0E6">₦11,250 each</text>
  <rect x="290" y="205" width="52" height="24" rx="12" fill="#4B3DF5"/>
  <text x="316" y="221" font-family="system-ui" font-weight="600" font-size="10" fill="white" text-anchor="middle">Collect</text>

  <!-- Naira challenge card -->
  <rect x="16" y="260" width="163" height="120" rx="20" fill="rgba(226,97,60,0.1)" stroke="rgba(226,97,60,0.2)" stroke-width="1"/>
  <text x="32" y="292" font-family="system-ui" font-weight="600" font-size="13" fill="#F4F0E6">₦ challenge</text>
  <text x="32" y="310" font-family="system-ui" font-size="10" fill="#8E90A6">Save ₦100/day</text>
  <text x="32" y="340" font-family="system-ui" font-weight="800" font-size="22" fill="#E2613C">Day 14</text>
  <text x="32" y="358" font-family="system-ui" font-size="10" fill="#8E90A6">of 30 · ₦1,400 saved</text>

  <!-- streak card -->
  <rect x="187" y="260" width="172" height="120" rx="20" fill="rgba(185,168,255,0.1)" stroke="rgba(185,168,255,0.2)" stroke-width="1"/>
  <text x="203" y="292" font-family="system-ui" font-weight="600" font-size="13" fill="#F4F0E6">Streak 🔥</text>
  <text x="203" y="310" font-family="system-ui" font-size="10" fill="#8E90A6">Bills paid on time</text>
  <text x="203" y="345" font-family="system-ui" font-weight="800" font-size="30" fill="#B9A8FF">7</text>
  <text x="203" y="370" font-family="system-ui" font-size="10" fill="#B9A8FF">weeks running</text>

  <!-- activity feed label -->
  <text x="24" y="412" font-family="system-ui" font-weight="600" font-size="13" fill="#F4F0E6">Recent activity</text>

  <!-- activity items -->
  <rect x="16" y="424" width="343" height="50" rx="12" fill="rgba(255,255,255,0.03)"/>
  <text x="32" y="452" font-family="system-ui" font-size="20">🍕</text>
  <text x="64" y="444" font-family="system-ui" font-weight="500" font-size="12" fill="#F4F0E6">Pizza with crew</text>
  <text x="64" y="462" font-family="system-ui" font-size="10" fill="#8E90A6">Split 6 ways · each paid ₦3,200</text>
  <text x="340" y="451" font-family="system-ui" font-size="11" fill="#E2613C" text-anchor="end">-₦3,200</text>

  <rect x="16" y="482" width="343" height="50" rx="12" fill="rgba(255,255,255,0.03)"/>
  <text x="32" y="510" font-family="system-ui" font-size="20">🎂</text>
  <text x="64" y="502" font-family="system-ui" font-weight="500" font-size="12" fill="#F4F0E6">Tunde's birthday pool</text>
  <text x="64" y="520" font-family="system-ui" font-size="10" fill="#8E90A6">Collected ₦25,000 · 5 contributed</text>
  <text x="340" y="509" font-family="system-ui" font-size="11" fill="#4B3DF5" text-anchor="end">+₦25,000</text>

  <rect x="16" y="540" width="343" height="50" rx="12" fill="rgba(255,255,255,0.03)"/>
  <text x="32" y="568" font-family="system-ui" font-size="20">⚡</text>
  <text x="64" y="560" font-family="system-ui" font-weight="500" font-size="12" fill="#F4F0E6">Chidi flexed ₦500 on you</text>
  <text x="64" y="578" font-family="system-ui" font-size="10" fill="#8E90A6">didii request · pay back?</text>
  <rect x="280" y="552" width="68" height="24" rx="12" fill="rgba(75,61,245,0.2)" stroke="rgba(75,61,245,0.3)" stroke-width="1"/>
  <text x="314" y="568" font-family="system-ui" font-size="10" fill="#4B3DF5" text-anchor="middle">Pay back</text>

  <!-- bottom nav -->
  <rect x="0" y="756" width="375" height="56" fill="rgba(12,14,26,0.95)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="48" y="785" font-family="system-ui" font-size="20" text-anchor="middle">💬</text>
  <text x="48" y="800" font-family="system-ui" font-size="9" fill="#8E90A6" text-anchor="middle">Chat</text>
  <text x="132" y="785" font-family="system-ui" font-size="20" text-anchor="middle">👛</text>
  <text x="132" y="800" font-family="system-ui" font-size="9" fill="#8E90A6" text-anchor="middle">Wallet</text>
  <text x="187" y="778" font-family="system-ui" font-size="24" text-anchor="middle">🎉</text>
  <text x="187" y="800" font-family="system-ui" font-size="9" fill="#E2613C" text-anchor="middle" font-weight="600">Fun</text>
  <text x="243" y="785" font-family="system-ui" font-size="20" text-anchor="middle">📊</text>
  <text x="243" y="800" font-family="system-ui" font-size="9" fill="#8E90A6" text-anchor="middle">Spend</text>
  <text x="328" y="785" font-family="system-ui" font-size="20" text-anchor="middle">⚙️</text>
  <text x="328" y="800" font-family="system-ui" font-size="9" fill="#8E90A6" text-anchor="middle">Profile</text>
</svg>
