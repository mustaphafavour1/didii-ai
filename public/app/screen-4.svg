  <text x="200" y="492" font-family="system-ui" font-weight="600" font-size="12" fill="#F4F0E6" text-anchor="end">3012345678</text>

  <line x1="32" y1="502" x2="343" y2="502" stroke="rgba(255,255,255,0.06)"/>

  <text x="32" y="524" font-family="system-ui" font-size="11" fill="#8E90A6">Amount</text>
  <text x="200" y="524" font-family="system-ui" font-weight="700" font-size="15" fill="#4B3DF5" text-anchor="end">₦30,000</text>

