  <rect x="256" y="556" width="103" height="48" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="307" y="585" font-family="system-ui" font-size="13" fill="#8E90A6" text-anchor="middle">Cancel</text>

