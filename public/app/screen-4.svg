  <text x="200" y="462" font-family="system-ui" font-weight="600" font-size="12" fill="#F4F0E6" text-anchor="end">First Bank</text>

  <line x1="32" y1="472" x2="343" y2="472" stroke="rgba(255,255,255,0.06)"/>

