  <circle cx="36" cy="314" r="16" fill="#B9A8FF"/>
  <text x="36" y="320" font-family="system-ui" font-weight="700" font-size="13" fill="#0C0E1A" text-anchor="middle">3</text>
  <rect x="64" y="300" width="295" height="56" rx="14" fill="rgba(185,168,255,0.1)" stroke="rgba(185,168,255,0.2)" stroke-width="1"/>
  <text x="80" y="324" font-family="system-ui" font-weight="600" font-size="13" fill="#F4F0E6">One word from you</text>
  <text x="80" y="342" font-family="system-ui" font-size="11" fill="#8E90A6">Money no dey move until you say yes</text>

